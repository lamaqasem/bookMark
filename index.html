<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"   href="main.css"/>
</head>
<body>
    <form class="form-bookmark">
        <div class="form-group">
            <input type="text" class="siteName"  placeholder="website name"/>
        </div>

        <div class="form-group">
            <input type="text" class="siteUrl" placeholder="website url"/>
        </div>

        <div class="form-group">
            <input type="text" class="email" placeholder="your email"/>
        </div>

        <div class="form-group">
            <input type="text" class="pass" placeholder="your password"/>
        </div>

        <button type="submit">Save</button>
    </form>


    <button class="removeall">Remove All</button>
    <table>
        <thead>
            <tr>
                <th>Site Name</th>
                <th>Site URL</th>
                <th>your email</th>
                <th>your password</th>
                <th>Action</th>
            </tr> 
        </thead>
        <tbody class="data">
            
        </tbody>
    </table>

    <script src="./main.js"></script>
    
</body>
</html>
